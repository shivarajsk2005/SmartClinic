{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Create patient account</h1>
    <p class="muted">Your information is stored in the SmartClinic database.</p>
    <form method="POST">
        <label>Full name</label>
        <input type="text" name="name" required>
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" minlength="6" required>
        <button class="button full" type="submit">Register</button>
    </form>
    <p class="center">Already registered? <a href="{{ url_for('login') }}">Client login</a></p>
    <p class="portal-switch">Are you a doctor? <a href="{{ url_for('doctor_login') }}">Go to doctor login</a></p>
</div>
{% endblock %}
