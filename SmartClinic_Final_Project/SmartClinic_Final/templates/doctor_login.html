{% extends "base.html" %}
{% block title %}Doctor Login{% endblock %}
{% block content %}
<div class="form-card doctor-login">
    <span class="eyebrow">DOCTOR PORTAL</span>
    <h1>Doctor login</h1>
    <p class="muted">Sign in to manage your appointments and availability.</p>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" value="{{ request.form.get('email','') }}" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <button class="button full" type="submit">Login as doctor</button>
    </form>
    <p class="portal-switch">Are you a client? <a href="{{ url_for('login') }}">Go to client login</a></p>
    <div class="doctor-demo">
        <strong>Demo doctor account</strong><br>
        anil@smartclinic.com / anil123
    </div>
</div>
{% endblock %}
