{% extends "base.html" %}
{% block title %}Edit Appointment{% endblock %}
{% block content %}
<div class="form-card wide">
<h1>Edit appointment</h1>
<p class="muted">Choose a new doctor, date or time.</p>
<form method="POST">
<label>Doctor</label>
<select name="doctor_id" id="doctor_id" required>
{% for d in doctors %}
<option value="{{ d.id }}" data-time="{{ d.available_time }}" data-active="{{ d.is_active }}" {% if not d.is_active %}disabled{% endif %} {% if d.id == appointment.doctor_id and d.is_active %}selected{% endif %}>{{ d.name }} — {{ d.specialization }} ({{ 'Active' if d.is_active else 'Inactive' }})</option>
{% endfor %}
</select>
<div id="availability" class="availability"></div>
<label>Date</label>
<input type="date" name="appointment_date" min="{{ today }}" value="{{ appointment.appointment_date }}" required>
<label>Time</label>
<select name="appointment_time" id="appointment_time" required></select>
<button class="button full" type="submit">Save Changes</button>
</form>
</div>
<script>
const ds=document.getElementById("doctor_id"), ts=document.getElementById("appointment_time"), av=document.getElementById("availability");
const currentTime="{{ appointment.appointment_time }}";
function ft(x){let [h,m]=x.split(":").map(Number);let s=h>=12?"PM":"AM";h=h%12||12;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")} ${s}`;}
function slots(r){let [a,b]=r.split("-"),[h,m]=a.split(":").map(Number),[eh,em]=b.split(":").map(Number),c=h*60+m,e=eh*60+em,o=[];while(c<e){o.push(`${String(Math.floor(c/60)).padStart(2,"0")}:${String(c%60).padStart(2,"0")}`);c+=30;}return o;}
function load(){let option=ds.options[ds.selectedIndex],r=option.dataset.time||"",active=option.dataset.active==="1";ts.innerHTML="";if(!r||!active){av.textContent="This doctor is currently inactive and cannot accept appointments.";ts.disabled=true;return;}av.textContent="Available: "+r.split("-").map(ft).join(" - ");ts.disabled=false;slots(r).forEach(s=>{let o=document.createElement("option");o.value=s;o.textContent=ft(s);if(s===currentTime)o.selected=true;ts.appendChild(o);});}
ds.addEventListener("change",load);load();
</script>
{% endblock %}
