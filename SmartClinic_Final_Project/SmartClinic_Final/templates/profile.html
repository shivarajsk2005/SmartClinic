{% extends "base.html" %}
{% block title %}Account Settings{% endblock %}
{% block content %}
<div class="form-card">
<h1>Account settings</h1>
<p class="muted">Update your stored account information.</p>
<form method="POST">
<label>Name</label>
<input type="text" name="name" value="{{ user.name }}" required>
<label>Email</label>
<input type="email" name="email" value="{{ user.email }}" required>
<label>New password</label>
<input type="password" name="password" placeholder="Leave blank to keep current password" minlength="6">
<button class="button full" type="submit">Update Account</button>
</form>
</div>
{% endblock %}
